version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medivoice-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=medivoice_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
    depends_on:
      db
    volumes:
      - ./medical_documents:/app/medical_documents
      - chroma_data:/app/chroma_db

  # Database Service
  db:
    image: postgres:15
    container_name: medivoice-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=medivoice_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ChromaDB Vector Store
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: medivoice-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ANONYMIZED_TELEMETRY=no
    volumes:
      - chroma_data:/root/.chroma

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: medivoice-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pg_data:
  chroma_data:
